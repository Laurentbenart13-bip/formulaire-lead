<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validation inscription — TLD 700</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 1rem; }
    .title { font-size: 20px; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 1.5rem; line-height: 1.6; }
    .recap {
      background: #f7f9fc;
      border: 1px solid #e0e8f0;
      border-radius: 8px;
      padding: 1rem;
      text-align: left;
      margin-bottom: 1.5rem;
      font-size: 14px;
      line-height: 1.8;
      color: #333;
    }
    .recap strong { color: #1a1a1a; }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }
    .btn:hover { background: #333; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg {
      display: none;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 14px;
    }
    .status-success { background: #ecfdf5; color: #166534; border: 1px solid #bbf7d0; display: none; }
    .status-error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: none; }
    .status-denied  { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-left: 6px;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-danger {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.75rem;
    }
    .btn-danger:hover { background: #b91c1c; }
    .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-delete-success { background: #ecfdf5; color: #166534; border: 1px solid #bbf7d0; padding: 0.75rem 1rem; border-radius: 8px; font-size: 14px; margin-top: 1rem; display: none; }
    .status-delete-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; padding: 0.75rem 1rem; border-radius: 8px; font-size: 14px; margin-top: 1rem; display: none; }

  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<div class="card" id="mainCard">
  <div class="icon">🔒</div>
  <div class="title">Vérification en cours...</div>
</div>

<script>
  // ── Configuration ──
  const TOKEN_SECRET              = "bidmYr-1vocwo-nacdur";
  const UPLOADCARE_SECRET_KEY     = "c07675130a3fd8eff6d6";
  const EMAILJS_PUBLIC_KEY  = "TA_PUBLIC_KEY_ICI";
  const EMAILJS_SERVICE_ID  = "TON_SERVICE_ID_ICI";
  const EMAILJS_TEMPLATE_CONFIRMATION = "TON_TEMPLATE_CONFIRMATION_ICI";

  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

  // ── Lecture des paramètres URL ──
  const params      = new URLSearchParams(window.location.search);
  const token       = params.get("token");
  const prenom      = params.get("prenom")       || "";
  const nom         = params.get("nom")           || "";
  const email       = params.get("email")         || "";
  const tel         = params.get("tel")           || "";
  const profil      = params.get("profil")        || "";
  const licence     = params.get("licence")       || "";
  const dates       = params.get("dates")         || "";
  const prix        = params.get("prix")          || "";
  const reglement_mode = params.get("reglement_mode") || "";

  const card = document.getElementById("mainCard");

  // ── Vérification du token ──
  if (token !== TOKEN_SECRET) {
    card.innerHTML = `
      <div class="icon">🚫</div>
      <div class="title">Accès refusé</div>
      <div class="subtitle">Le lien de validation est invalide ou a expiré.</div>
      <div class="status-msg status-denied" style="display:block; margin-top:1rem;">
        Token de sécurité incorrect.
      </div>
    `;
  } else {
    // ── Affichage du récapitulatif ──
    card.innerHTML = `
      <div class="icon">✅</div>
      <div class="title">Valider l'inscription</div>
      <div class="subtitle">Vous êtes sur le point d'envoyer un email de confirmation à <strong>${prenom} ${nom}</strong>.</div>
      <div class="recap">
        <strong>Profil :</strong> ${profil}<br>
        <strong>Email :</strong> ${email}<br>
        <strong>Téléphone :</strong> ${tel}<br>
        <strong>Licence FFTir :</strong> ${licence}<br>
        <strong>Dates :</strong> ${dates}<br>
        <strong>Montant :</strong> ${prix}<br>
        <strong>Règlement :</strong> ${reglement_mode}
      </div>
      <button class="btn" id="btnValider" onclick="validerInscription()">
        ✅ Confirmer et envoyer l'email
        <span class="spinner" id="spinner"></span>
      </button>
      <div class="status-msg status-success" id="successMsg">
        ✅ Email de confirmation envoyé à ${email} !
      </div>
      <div class="status-msg status-error" id="errorMsg">
        ❌ Erreur lors de l'envoi. Vérifiez vos clés EmailJS.
      </div>
      <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #e5e5e5;" />
      <p style="font-size: 13px; color: #666; margin-bottom: 0.5rem;">
        ⚠️ <strong>RGPD</strong> — Après validation, supprimez les documents du candidat conformément à votre politique de conservation.
      </p>
      <button class="btn-danger" id="btnSupprimer" onclick="supprimerDocuments()">
        🗑️ Supprimer les documents
      </button>
      <div class="status-delete-success" id="deleteSuccessMsg">
        ✅ Documents supprimés avec succès.
      </div>
      <div class="status-delete-error" id="deleteErrorMsg">
        ❌ Erreur lors de la suppression. Supprimez manuellement sur Uploadcare.
      </div>
    `;
  }

  // Extraire les UUIDs Uploadcare depuis une URL
  function extractUUID(url) {
    if (!url || url === "Non fourni" || url === "Non applicable") return null;
    const match = url.match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/);
    return match ? match[1] : null;
  }

  async function supprimerDocuments() {
    const btn = document.getElementById("btnSupprimer");
    const successMsg = document.getElementById("deleteSuccessMsg");
    const errorMsg   = document.getElementById("deleteErrorMsg");

    btn.disabled = true;
    btn.textContent = "⏳ Suppression en cours...";
    successMsg.style.display = "none";
    errorMsg.style.display   = "none";

    // Récupérer les URLs depuis les paramètres URL
    const pieceIdentite = params.get("piece_identite");
    const ficheSIA      = params.get("fiche_sia");
    const permisChasse  = params.get("permis_chasse");
    const assurance     = params.get("assurance");

    const uuids = [pieceIdentite, ficheSIA, permisChasse, assurance]
      .map(extractUUID)
      .filter(Boolean);

    if (uuids.length === 0) {
      errorMsg.textContent = "❌ Aucun document trouvé à supprimer.";
      errorMsg.style.display = "block";
      btn.disabled = false;
      btn.textContent = "🗑️ Supprimer les documents";
      return;
    }

    let success = 0;
    let errors  = 0;

    for (const uuid of uuids) {
      try {
        const res = await fetch("https://api.uploadcare.com/files/" + uuid + "/storage/", {
          method: "DELETE",
          headers: {
            "Authorization": "Uploadcare.Simple " + "c9d75257ae4335d97d3d" + ":" + UPLOADCARE_SECRET_KEY,
            "Accept": "application/vnd.uploadcare-v0.7+json",
          }
        });
        if (res.ok || res.status === 404) {
          success++;
        } else {
          errors++;
        }
      } catch(e) {
        errors++;
      }
    }

    if (errors === 0) {
      successMsg.textContent = "✅ " + success + " document(s) supprimé(s) avec succès.";
      successMsg.style.display = "block";
      btn.textContent = "✅ Documents supprimés";
    } else {
      errorMsg.textContent = "⚠️ " + success + " supprimé(s), " + errors + " erreur(s). Vérifiez manuellement sur Uploadcare.";
      errorMsg.style.display = "block";
      btn.disabled = false;
      btn.textContent = "🗑️ Réessayer";
    }
  }

  async function validerInscription() {
    const btn     = document.getElementById("btnValider");
    const spinner = document.getElementById("spinner");
    const successMsg = document.getElementById("successMsg");
    const errorMsg   = document.getElementById("errorMsg");

    btn.disabled = true;
    spinner.style.display = "inline-block";
    successMsg.style.display = "none";
    errorMsg.style.display   = "none";

    try {
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_CONFIRMATION, {
        to_email     : email,
        prenom       : prenom,
        nom          : nom,
        profil       : profil,
        licence      : licence,
        dates        : dates,
        prix         : prix,
        reglement_mode : reglement_mode,
      });

      successMsg.style.display = "block";
      btn.textContent = "✅ Email envoyé !";

    } catch (err) {
      console.error("EmailJS error:", err);
      errorMsg.style.display = "block";
      btn.disabled = false;
      spinner.style.display = "none";
    }
  }
</script>
</body>
</html>
